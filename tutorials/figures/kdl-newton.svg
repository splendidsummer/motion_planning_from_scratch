<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="500" viewBox="0 0 720 500" role="img" aria-label="KDL 从一个种子做位置迭代的简化示意">
  <rect width="720" height="500" fill="#fcfcfc"/>
  <text x="8" y="24" fill="#1c1c1c" font-size="18" font-weight="500" font-family="Noto Sans CJK SC, Noto Sans, sans-serif">一个种子上的位置迭代（简图）</text>
  <text x="8" y="46" fill="#5c5c5c" font-size="14" font-family="Noto Sans CJK SC, Noto Sans, sans-serif">MoveIt 2.5.9：epsilon 默认 1e-5，最多 500 次；失败且未超时才换种子。</text>

  <rect x="150" y="68" width="320" height="46" rx="6" fill="#fde7f4" stroke="#ec77bf" stroke-width="2"/>
  <text x="310" y="97" text-anchor="middle" fill="#1c1c1c" font-size="15" font-family="Noto Sans CJK SC, Noto Sans, sans-serif">1  种子 q，已在关节限位内</text>

  <line x1="310" y1="114" x2="310" y2="132" stroke="#1c1c1c" stroke-width="2"/>
  <polygon points="304,132 316,132 310,140" fill="#1c1c1c"/>

  <rect x="150" y="144" width="320" height="46" rx="6" fill="#ffffff" stroke="#ec77bf" stroke-width="2"/>
  <text x="310" y="173" text-anchor="middle" fill="#1c1c1c" font-size="15" font-family="Noto Sans CJK SC, Noto Sans, sans-serif">2  正运动学，检查末端误差 e</text>

  <line x1="310" y1="190" x2="310" y2="208" stroke="#1c1c1c" stroke-width="2"/>
  <polygon points="304,208 316,208 310,216" fill="#1c1c1c"/>

  <rect x="150" y="220" width="320" height="46" rx="6" fill="#ffffff" stroke="#ec77bf" stroke-width="2"/>
  <text x="310" y="249" text-anchor="middle" fill="#1c1c1c" font-size="15" font-family="Noto Sans CJK SC, Noto Sans, sans-serif">3  加权 SVD 求 Δq，必要时回退</text>

  <line x1="310" y1="266" x2="310" y2="284" stroke="#1c1c1c" stroke-width="2"/>
  <polygon points="304,284 316,284 310,292" fill="#1c1c1c"/>

  <rect x="150" y="296" width="320" height="46" rx="6" fill="#ffffff" stroke="#ec77bf" stroke-width="2"/>
  <text x="310" y="325" text-anchor="middle" fill="#1c1c1c" font-size="15" font-family="Noto Sans CJK SC, Noto Sans, sans-serif">4  限位／扰动处理，q ← q + Δq</text>

  <line x1="310" y1="342" x2="310" y2="360" stroke="#1c1c1c" stroke-width="2"/>
  <polygon points="304,360 316,360 310,368" fill="#1c1c1c"/>

  <rect x="150" y="372" width="200" height="46" rx="6" fill="#ffffff" stroke="#1c1c1c" stroke-width="2"/>
  <text x="250" y="401" text-anchor="middle" fill="#1c1c1c" font-size="15" font-family="Noto Sans CJK SC, Noto Sans, sans-serif">5  重新检查：收敛？</text>

  <line x1="350" y1="395" x2="468" y2="395" stroke="#1c1c1c" stroke-width="2"/>
  <polygon points="468,389 468,401 478,395" fill="#1c1c1c"/>
  <rect x="482" y="372" width="210" height="46" rx="6" fill="#e4edff" stroke="#2268ff" stroke-width="2"/>
  <text x="587" y="401" text-anchor="middle" fill="#1c1c1c" font-size="15" font-family="Noto Sans CJK SC, Noto Sans, sans-serif">是，得到候选关节解</text>

  <path d="M150 395 H64 V167 H150" fill="none" stroke="#ec77bf" stroke-width="2"/>
  <polygon points="150,161 150,173 160,167" fill="#ec77bf"/>
  <text x="52" y="290" fill="#1c1c1c" font-size="13" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" transform="rotate(-90 52 290)">否，回到第 2 步</text>

  <path d="M250 418 V448 H708 V91 H470" fill="none" stroke="#5c5c5c" stroke-width="1.5" stroke-dasharray="5 4"/>
  <polygon points="470,85 470,97 460,91" fill="#5c5c5c"/>
  <text x="580" y="78" text-anchor="middle" fill="#5c5c5c" font-size="12" font-family="Noto Sans CJK SC, Noto Sans, sans-serif">局部失败且未超时：换种子</text>
  <text x="16" y="481" fill="#5c5c5c" font-size="13" font-family="Noto Sans CJK SC, Noto Sans, sans-serif">收敛条件：位置误差 ≤ 1e-5 m 且旋转误差 ≤ 1e-5 rad；实际在每轮 FK 后检查。</text>
</svg>
