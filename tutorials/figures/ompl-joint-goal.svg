<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="460" viewBox="0 0 720 460" role="img" aria-label="客户端先试关节直线，检查失败或段数过多再交给 OMPL">
  <rect width="720" height="460" fill="#fcfcfc"/>
  <text x="8" y="24" fill="#1c1c1c" font-size="18" font-weight="500" font-family="Noto Sans CJK SC, Noto Sans, sans-serif">关节目标之后</text>
  <text x="8" y="46" fill="#5c5c5c" font-size="14" font-family="Noto Sans CJK SC, Noto Sans, sans-serif">两关节示意；实际为 7／14 维。直线到指定目标，OMPL 目标容差为 ±0.05 rad。</text>

  <rect x="16" y="68" width="336" height="292" rx="8" fill="#ffffff" stroke="#1c1c1c" stroke-width="2"/>
  <rect x="368" y="68" width="336" height="292" rx="8" fill="#ffffff" stroke="#1c1c1c" stroke-width="2"/>
  <text x="184" y="92" text-anchor="middle" fill="#1c1c1c" font-size="15" font-weight="500" font-family="Noto Sans CJK SC, Noto Sans, sans-serif">客户端直线：离散检查通过</text>
  <text x="536" y="92" text-anchor="middle" fill="#1c1c1c" font-size="15" font-weight="500" font-family="Noto Sans CJK SC, Noto Sans, sans-serif">检查失败或段数过多：OMPL</text>

  <text x="44" y="338" fill="#5c5c5c" font-size="12" font-family="Noto Sans CJK SC, Noto Sans, sans-serif">q1</text>
  <text x="28" y="128" fill="#5c5c5c" font-size="12" font-family="Noto Sans CJK SC, Noto Sans, sans-serif">q2</text>
  <text x="396" y="338" fill="#5c5c5c" font-size="12" font-family="Noto Sans CJK SC, Noto Sans, sans-serif">q1</text>
  <text x="380" y="128" fill="#5c5c5c" font-size="12" font-family="Noto Sans CJK SC, Noto Sans, sans-serif">q2</text>

  <rect x="156" y="272" width="72" height="36" fill="#e6e6e8" stroke="#1c1c1c" stroke-width="2"/>
  <text x="192" y="295" text-anchor="middle" fill="#1c1c1c" font-size="13" font-family="Noto Sans CJK SC, Noto Sans, sans-serif">障碍</text>
  <line x1="70" y1="310" x2="286" y2="150" stroke="#2268ff" stroke-width="3"/>
  <circle cx="70" cy="310" r="6" fill="#e4edff" stroke="#2268ff" stroke-width="2"/>
  <rect x="274" y="138" width="24" height="24" fill="#e4edff" stroke="#2268ff" stroke-width="2"/>
  <text x="84" y="328" fill="#1c1c1c" font-size="13" font-family="Noto Sans CJK SC, Noto Sans, sans-serif">q_start</text>
  <text x="268" y="132" text-anchor="end" fill="#1c1c1c" font-size="13" font-family="Noto Sans CJK SC, Noto Sans, sans-serif">q_goal</text>

  <rect x="500" y="186" width="78" height="64" fill="#e6e6e8" stroke="#1c1c1c" stroke-width="2"/>
  <text x="539" y="222" text-anchor="middle" fill="#1c1c1c" font-size="13" font-family="Noto Sans CJK SC, Noto Sans, sans-serif">障碍</text>
  <line x1="422" y1="310" x2="640" y2="150" stroke="#b4b4b8" stroke-width="2" stroke-dasharray="5 4"/>
  <line x1="522" y1="228" x2="536" y2="214" stroke="#1c1c1c" stroke-width="2"/>
  <line x1="536" y1="228" x2="522" y2="214" stroke="#1c1c1c" stroke-width="2"/>

  <line x1="422" y1="310" x2="470" y2="250" stroke="#ec77bf" stroke-width="3"/>
  <line x1="470" y1="250" x2="486" y2="148" stroke="#ec77bf" stroke-width="3"/>
  <line x1="486" y1="148" x2="628" y2="150" stroke="#ec77bf" stroke-width="3"/>
  <circle cx="422" cy="310" r="6" fill="#fde7f4" stroke="#ec77bf" stroke-width="2"/>
  <circle cx="470" cy="250" r="5" fill="#fde7f4" stroke="#ec77bf" stroke-width="2"/>
  <circle cx="486" cy="148" r="5" fill="#fde7f4" stroke="#ec77bf" stroke-width="2"/>
  <rect x="628" y="138" width="24" height="24" fill="#e4edff" stroke="#2268ff" stroke-width="2"/>
  <text x="438" y="328" fill="#1c1c1c" font-size="13" font-family="Noto Sans CJK SC, Noto Sans, sans-serif">q_start</text>
  <text x="620" y="132" text-anchor="end" fill="#1c1c1c" font-size="13" font-family="Noto Sans CJK SC, Noto Sans, sans-serif">q_goal</text>

  <text x="184" y="388" text-anchor="middle" fill="#1c1c1c" font-size="14" font-family="Noto Sans CJK SC, Noto Sans, sans-serif">脚本写时间，不运行 OMPL／TOTG</text>
  <text x="536" y="388" text-anchor="middle" fill="#1c1c1c" font-size="14" font-family="Noto Sans CJK SC, Noto Sans, sans-serif">虚线被丢弃，粉色为搜索所得路径</text>

  <text x="16" y="424" fill="#5c5c5c" font-size="14" font-family="Noto Sans CJK SC, Noto Sans, sans-serif">左：手工分配时间，未做限加速度参数化。右：TOTG 重采样并生成时间、速度和加速度。</text>
  <text x="16" y="446" fill="#1c1c1c" font-size="14" font-family="Noto Sans CJK SC, Noto Sans, sans-serif">右侧请求的速度／加速度缩放均为 0.25。两侧的离散检查都不是连续无碰撞保证。</text>
</svg>
