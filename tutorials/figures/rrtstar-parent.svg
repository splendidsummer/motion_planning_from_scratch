<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="540" viewBox="0 0 720 540" role="img" aria-label="父节点改成总代价更小的近邻">
  <rect width="720" height="540" fill="#fcfcfc"/>
  <text x="8" y="24" text-anchor="start" fill="#1c1c1c" font-size="18" font-weight="500" font-family="Noto Sans CJK SC, Noto Sans, sans-serif">父节点改成总代价更小的近邻</text>
  <text x="8" y="46" text-anchor="start" fill="#5c5c5c" font-size="14" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans, sans-serif">球里下面那个点走到 q_new 的总代价更小，所以父节点是它。最近的点没有被选上。</text>
  <rect x="16" y="64" width="688" height="460" rx="8" fill="#fcfcfc" stroke="#1c1c1c" stroke-width="2"/>
  <circle cx="420" cy="300" r="200" fill="none" stroke="#b4b4b8" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="584" y="118" text-anchor="start" fill="#5c5c5c" font-size="14" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans, sans-serif">r(n)</text>
  <line x1="80" y1="360" x2="240" y2="360" stroke="#ec77bf" fill="none" stroke-width="2"/><line x1="240" y1="360" x2="360" y2="230" stroke="#ec77bf" fill="none" stroke-width="2"/><line x1="240" y1="360" x2="420" y2="300" stroke="#ec77bf" fill="none" stroke-width="3"/><circle cx="80" cy="360" r="6" fill="#fde7f4" stroke="#ec77bf" stroke-width="2"/><circle cx="360" cy="230" r="6" fill="#fde7f4" stroke="#ec77bf" stroke-width="2"/><circle cx="240" cy="360" r="12" fill="none" stroke="#ec77bf" stroke-width="2"/><circle cx="240" cy="360" r="6" fill="#fde7f4" stroke="#ec77bf" stroke-width="2"/><circle cx="420" cy="300" r="6" fill="#fde7f4" stroke="#ec77bf" stroke-width="2"/><text x="80" y="384" text-anchor="middle" fill="#1c1c1c" font-size="14" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans, sans-serif">起点</text><text x="240" y="384" text-anchor="middle" fill="#1c1c1c" font-size="14" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans, sans-serif">Cost 160</text><text x="346" y="234" text-anchor="end" fill="#1c1c1c" font-size="14" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans, sans-serif">Cost 337</text><text x="436" y="292" text-anchor="start" fill="#1c1c1c" font-size="14" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans, sans-serif">q_new</text><text x="436" y="312" text-anchor="start" fill="#1c1c1c" font-size="14" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans, sans-serif">Cost 350</text><text x="300" y="430" text-anchor="start" fill="#1c1c1c" font-size="14" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans, sans-serif">160 + 190 = 350</text>
</svg>
